name: Release

# Випуск створюється лише тоді, коли в Подання.html є версія, для якої ще немає випуску.
# Номер версії береться з рядка «Версія X.Y» у файлі. Тег = X.Y, назва = vX.Y.

on:
  push:
    branches: [main]
    paths:
      - "Подання.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Подання.html
        id: ver
        run: |
          header=$(grep -oP 'class="ver">Версія \K[0-9]+\.[0-9]+' "Подання.html" | head -1)
          footer=$(grep -oP 'Версія \K[0-9]+\.[0-9]+(?= · ©)' "Подання.html" | head -1)
          if [[ -z "$header" ]]; then
            echo "::error::Не знайдено версію в заголовку Подання.html (рядок «Версія X.Y»)."
            exit 1
          fi
          if [[ "$header" != "$footer" ]]; then
            echo "::error::Версія в заголовку ($header) не збігається з версією в підвалі ($footer)."
            exit 1
          fi
          echo "tag=$header" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: exists
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Випуск ${{ steps.ver.outputs.tag }} уже існує. Новий не створюється. Змініть номер версії в Подання.html, щоб зробити новий випуск."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.exists.outputs.found == 'false'
        run: |
          # GitHub strips non-ASCII from asset names (-> default.html), so attach under a Latin name
          cp "Подання.html" Podannya.html
          gh release create "${{ steps.ver.outputs.tag }}" Podannya.html \
            --target "${{ github.sha }}" \
            --title "v${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            --latest
